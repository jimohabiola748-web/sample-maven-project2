name: Maven Build and Run Java

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-maven-project2

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build and Run with Maven
      working-directory: my-app/mvn
      run: mvn clean install

    - name: Run Java Application
      working-directory: my-app/mvn
      run: java -cp target/my-app-1.0-SNAPSHOT.jar com.mycompany.app.App
